name: matar_tasbiha_2026
description: "تطبيق تسبيحة الإسلامي"
publish_to: 'none'

version: 1.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.9
  firebase_remote_config: ^4.3.9
  
  # الإشعارات والموقع والبوصلة
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  geolocator: ^10.1.0
  flutter_compass: ^0.8.1
  adhan: ^2.0.0+1
  shared_preferences: ^2.2.2
  
  # أدوات مساعدة
  upgrader: ^8.4.0
  quran: ^1.2.2
  share_plus: ^7.2.1
  in_app_review: ^2.0.8
  url_launcher: ^6.2.2
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700