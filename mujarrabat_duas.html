<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية مجربة - من التضرع إلى ذي الجلال والإكرام</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #556B2F;
            --secondary: #8FBC8F;
            --accent: #DAA520;
            --bg: #F5F5DC;
            --text: #2c3e50;
            --card: #ffffff;
        }

        body.dark-mode {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --card: #2d2d2d;
        }

        body {
            font-family: 'Amiri', 'Scheherazade New', 'Traditional Arabic', serif;
            background: linear-gradient(135deg, var(--bg) 0%, #E8F5E9 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            transition: all 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d3e2f 100%);
        }

        .progress-bar {
            position: fixed;
            top: 0;
            right: 0;
            width: 0%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--secondary));
            z-index: 1000;
            transition: width 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #2d3e2f 100%);
            color: var(--accent);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 5px solid var(--accent);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-weight: 700;
        }

        .header .subtitle {
            font-size: 1.3em;
            color: #fff;
            margin-top: 10px;
        }

        .ornament {
            text-align: center;
            font-size: 1.5em;
            color: var(--accent);
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .dua-section {
            padding: 30px;
            margin: 20px;
            background: var(--card);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 2px solid var(--secondary);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s ease forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .dua-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(85, 107, 47, 0.2);
            border-color: var(--accent);
        }

        .dua-number {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(85, 107, 47, 0.3);
        }

        .dua-text {
            font-size: 1.4em;
            line-height: 2.2;
            color: var(--text);
            text-align: center;
            padding: 20px;
            background: rgba(143, 188, 143, 0.1);
            border-radius: 10px;
            margin: 15px 0;
        }

        .closing {
            text-align: center;
            font-size: 1.3em;
            color: var(--primary);
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(to right, rgba(143, 188, 143, 0.2), rgba(218, 165, 32, 0.1), rgba(143, 188, 143, 0.2));
            border-radius: 10px;
            border: 2px solid var(--accent);
        }

        .separator {
            text-align: center;
            margin: 30px 0;
            font-size: 1.8em;
            color: var(--accent);
            letter-spacing: 8px;
        }

        .footer {
            background: linear-gradient(135deg, var(--primary) 0%, #2d3e2f 100%);
            color: var(--accent);
            text-align: center;
            padding: 30px;
            font-size: 1.2em;
        }

        .floating-buttons {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 999;
        }

        .float-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            font-family: 'Amiri', serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .float-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .float-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .dua-counter {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1em;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 998;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8em; }
            .dua-text { font-size: 1.2em; line-height: 2; }
            .dua-section { padding: 20px; margin: 15px; }
            .floating-buttons { bottom: 20px; left: 20px; }
            .float-btn { padding: 12px 20px; font-size: 0.9em; }
            .dua-counter { top: 10px; left: 10px; padding: 8px 15px; font-size: 0.9em; }
        }

        @media print {
            .floating-buttons, .dua-counter, .progress-bar { display: none !important; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border-radius: 0; }
            .dua-section { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    <div class="dua-counter" id="duaCounter">الدعاء ١ من ١٠٠</div>

    <div class="container">
        <div class="header">
            <h1>✦ مِنَ التَّضَرُّعِ إِلَىٰ ذِي الْجَلَالِ وَالْإِكْرَامِ ✦</h1>
            <div class="ornament">✧•°๑❁๑๑°•</div>
            <div class="subtitle">أدعية مجربة</div>
        </div>

        <div id="duasContainer"></div>

        <div class="footer">
            <div class="ornament">✧•°๑๑❁๑๑°•✧</div>
            <p>✦ ياذا الجلال والإكرام اكرمني بقدر رحمة الله الرحمن الرحيم ✦</p>
            <p style="margin-top: 15px; font-size: 0.9em;">تم بحمد الله - ١٠٠ دعاء</p>
        </div>
    </div>

    <div class="floating-buttons">
        <button class="float-btn hidden" id="backToTop" onclick="scrollToTop()">
            <span>⬆️</span>
            <span>الأعلى</span>
        </button>
        <button class="float-btn" onclick="toggleDarkMode()">
            <span id="darkModeIcon">🌙</span>
            <span id="darkModeText">الوضع الليلي</span>
        </button>
        <button class="float-btn" onclick="window.print()">
            <span>️</span>
            <span>طباعة</span>
        </button>
    </div>

    <script>
        const duas = [
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا اللهُ، يَا رَحْمٰنُ، يَا رَحِيمُ، يَا كَرِيمُ، يَا مُقِيمُ، يَا عَظِيمُ، يَا قَدِيمُ، يَا عَلِيمُ، يَا حَلِيمُ، يَا حَكِيمُ.<br><br>سُبْحَانَكَ يَا لَا إِلٰهَ إِلَّا أَنْتَ، يَا غِيَاثَ المُسْتَغِيثِينَ أَغِثْنِي، خَلِّصْنَا مِنَ النَّارِ يَا رَبِّ.",
            "يَا سَيِّدَ السَّادَاتِ، يَا مُجِيبَ الدَّعَوَاتِ، يَا رَافِعَ الدَّرَجَاتِ، يَا وَلِيَّ الْحَسَنَاتِ، يَا غَافِرَ الْخَطِيئَاتِ، يَا مُعْطِيَ الْمَسْأَلَاتِ، يَا قَابِلَ التَّوْبَاتِ، يَا سَامِعَ الْأَصْوَاتِ، يَا عَالِمَ الْخَفِيَّاتِ، يَا دَافِعَ الْبَلِيَّاتِ.",
            "يَا خَيْرَ الْغَافِرِينَ، يَا خَيْرَ الْفَاتِحِينَ، يَا خَيْرَ النَّاصِرِينَ، يَا خَيْرَ الْحَاكِمِينَ، يَا خَيْرَ الرَّازِقِينَ، يَا خَيْرَ الْوَارِثِينَ، يَا خَيْرَ الْحَامِدِينَ، يَا خَيْرَ الذَّاكِرِينَ، يَا خَيْرَ الْمُنْزِلِينَ، يَا خَيْرَ الْمُحْسِنِينَ.",
            "يَا مَنْ لَهُ الْعِزَّةُ وَالْجَمَالُ، يَا مَنْ لَهُ الْقُدْرَةُ وَالْكَمَالُ، يَا مَنْ لَهُ الْمُلْكُ وَالْجَلَالُ، يَا مَنْ هُوَ الْكَبِيرُ الْمُتَعَالُ، يَا مُنْشِيءَ السَّحَابِ الثِّقَالِ، يَا مَنْ هُوَ شَدِيدُ الْمِحَالِ، يَا مَنْ هُوَ سَرِيعُ الْحِسَابِ، يَا مَنْ هُوَ شَدِيدُ الْعِقَابِ، يَا مَنْ عِنْدَهُ حُسْنُ الثَّوَابِ، يَا مَنْ عِنْدَهُ أُمُّ الْكِتَابِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا حَنَّانُ، يَا مَنَّانُ، يَا دَيَّانُ، يَا بُرْهَانُ، يَا سُلْطَانُ، يَا رِضْوَانُ، يَا غُفْرَانُ، يَا سُبْحَانُ، يَا مُسْتَعَانُ، يَا ذَا الْمَنِّ وَالْبَيَانِ.",
            "يَا مَنْ تَوَاضَعَ كُلُّ شَيْءٍ لِعَظَمَتِهِ، يَا مَنِ اسْتَسْلَمَ كُلُّ شَيْءٍ لِقُدْرَتِهِ، يَا مَنْ ذَلَّ كُلُّ شَيْءٍ لِعِزَّتِهِ، يَا مَنْ خَضَعَ كُلُّ شَيْءٍ لِهَيْبَتِهِ، يَا مَنِ انْقَادَ كُلُّ شَيْءٍ مِنْ خَشْيَتِهِ، يَا مَنْ تَشَقَّقَتِ الْجِبَالُ مِنْ مَخَافَتِهِ، يَا مَنْ قَامَتِ السَّمَاوَاتُ بِأَمْرِهِ، يَا مَنِ اسْتَقَرَّتِ الْأَرْضُونَ بِإِذْنِهِ، يَا مَنْ يُسَبِّحُ الرَّعْدُ بِحَمْدِهِ، يَا مَنْ لَا يَعْتَدِي عَلَى أَهْلِ مَمْلَكَتِهِ.",
            "يَا غَافِرَ الْخَطَايَا، يَا كَاشِفَ الْبَلَايَا، يَا مُنْتَهَى الرَّجَايَا، يَا مُجْزِلَ الْعَطَايَا، يَا وَاهِبَ الْهَدَايَا، يَا رَازِقَ الْبَرَايَا، يَا قَاضِيَ الْمَنَايَا، يَا سَامِعَ الشَّكَايَا، يَا بَاعِثَ الْبَرَايَا، يَا مُطْلِقَ الْأُسَارَى.",
            "يَا ذَا الْحَمْدِ وَالثَّنَاءِ، يَا ذَا الْفَخْرِ وَالْبَهَاءِ، يَا ذَا الْمَجْدِ وَالسَّنَاءِ، يَا ذَا الْعَهْدِ وَالْوَفَاءِ، يَا ذَا الْعَفْوِ وَالرِّضَاءِ، يَا ذَا الْمَنِّ وَالْعَطَاءِ، يَا ذَا الْفَصْلِ وَالْقَضَاءِ، يَا ذَا الْعِزِّ وَالْبَقَاءِ، يَا ذَا الْجُودِ وَالسَّخَاءِ، يَا ذَا الْآلَاءِ وَالنَّعْمَاءِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مَانِعُ، يَا دَافِعُ، يَا رَافِعُ، يَا صَانِعُ، يَا نَافِعُ، يَا سَامِعُ، يَا جَامِعُ، يَا شَافِعُ، يَا وَاسِعُ، يَا مُوسِعُ.",
            "يَا صَانِعَ كُلِّ مَصْنُوعٍ، يَا خَالِقَ كُلِّ مَخْلُوقٍ، يَا رَازِقَ كُلِّ مَرْزُوقٍ، يَا مَالِكَ كُلِّ مَمْلُوكٍ، يَا كَاشِفَ كُلِّ مَكْرُوبٍ، يَا فَارِجَ كُلِّ مَهْمُومٍ، يَا رَاحِمَ كُلِّ مَرْحُومٍ، يَا نَاصِرَ كُلِّ مَخْذُولٍ، يَا سَاتِرَ كُلِّ مَعْيُوبٍ، يَا مَلْجَأَ كُلِّ مَطْرُودٍ.",
            "يَا عُدَّتِي عِنْدَ شِدَّتِي، يَا رَجَائِي عِنْدَ مُصِيبَتِي، يَا مُونِسِي عِنْدَ وَحْشَتِي، يَا صَاحِبِي عِنْدَ غُرْبَتِي، يَا وَلِيِّي عِنْدَ نِعْمَتِي، يَا غِيَاثِي عِنْدَ كُرْبَتِي، يَا دَلِيلِي عِنْدَ حَيْرَتِي، يَا غَنَائِي عِنْدَ افْتِقَارِي، يَا مَلْجَإِي عِنْدَ اضْطِرَارِي، يَا مُعِينِي عِنْدَ مَفْزَعِي.",
            "يَا عَلَّامَ الْغُيُوبِ، يَا غَفَّارَ الذُّنُوبِ، يَا سَتَّارَ الْعُيُوبِ، يَا كَاشِفَ الْكُرُوبِ، يَا مُقَلِّبَ الْقُلُوبِ، يَا طَبِيبَ الْقُلُوبِ، يَا مُنَوِّرَ الْقُلُوبِ، يَا أَنِيسَ الْقُلُوبِ، يَا مُفَرِّجَ الْهُمُومِ، يَا مُنَفِّسَ الْغُمُومِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا جَلِيلُ، يَا جَمِيلُ، يَا وَكِيلُ، يَا كَفِيلُ، يَا دَلِيلُ، يَا قَبِيلُ، يَا مُدِيلُ، يَا مُنِيلُ، يَا مُقِيلُ، يَا مُحِيلُ.",
            "يَا دَلِيلَ الْمُتَحَيِّرِينَ، يَا غِيَاثَ الْمُسْتَغِيثِينَ، يَا صَرِيخَ الْمُسْتَصْرِخِينَ، يَا جَارَ الْمُسْتَجِيرِينَ، يَا أَمَانَ الْخَائِفِينَ، يَا عَوْنَ الْمُؤْمِنِينَ، يَا رَاحِمَ الْمَسَاكِينَ، يَا مَلْجَأَ الْعَاصِينَ، يَا غَافِرَ الْمُذْنِبِينَ، يَا مُجِيبَ دَعْوَةِ الْمُضْطَرِّينَ.",
            "يَا ذَا الْجُودِ وَالْإِحْسَانِ، يَا ذَا الْفَضْلِ وَالِامْتِنَانِ، يَا ذَا الْأَمْنِ وَالْأَمَانِ، يَا ذَا الْقُدْسِ وَالسُّبْحَانِ، يَا ذَا الْحِكْمَةِ وَالْبَيَانِ، يَا ذَا الرَّحْمَةِ وَالرِّضْوَانِ، يَا ذَا الْحُجَّةِ وَالْبُرْهَانِ، يَا ذَا الْعَظَمَةِ وَالسُّلْطَانِ، يَا ذَا الرَّأْفَةِ وَالْمُسْتَعَانِ، يَا ذَا الْعَفْوِ وَالْغُفْرَانِ.",
            "يَا مَنْ هُوَ رَبُّ كُلِّ شَيْءٍ، يَا مَنْ هُوَ إِلٰهُ كُلِّ شَيْءٍ، يَا مَنْ هُوَ خَالِقُ كُلِّ شَيْءٍ، يَا مَنْ هُوَ صَانِعُ كُلِّ شَيْءٍ، يَا مَنْ هُوَ قَبْلَ كُلِّ شَيْءٍ، يَا مَنْ هُوَ بَعْدَ كُلِّ شَيْءٍ، يَا مَنْ هُوَ فَوْقَ كُلِّ شَيْءٍ، يَا مَنْ هُوَ عَالِمٌ بِكُلِّ شَيْءٍ، يَا مَنْ هُوَ قَادِرٌ عَلَى كُلِّ شَيْءٍ، يَا مَنْ هُوَ يَبْقَىٰ وَيَفْنَىٰ كُلُّ شَيْءٍ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مُؤْمِنُ، يَا مُهَيْمِنُ، يَا مُكَوِّنُ، يَا مُلَقِّنُ، يَا مُبَيِّنُ، يَا مُهَوِّنُ، يَا مُمَكِّنُ، يَا مُزَيِّنُ، يَا مُعْلِنُ، يَا مُقَسِّمُ.",
            "يَا مَنْ هُوَ فِي مُلْكِهِ مُقِيمٌ، يَا مَنْ هُوَ فِي سُلْطَانِهِ قَدِيمٌ، يَا مَنْ هُوَ فِي جَلَالِهِ عَظِيمٌ، يَا مَنْ هُوَ عَلَىٰ عِبَادِهِ رَحِيمٌ، يَا مَنْ هُوَ بِكُلِّ شَيْءٍ عَلِيمٌ، يَا مَنْ هُوَ بِمَنْ عَصَاهُ حَلِيمٌ، يَا مَنْ هُوَ بِمَنْ رَجَاهُ كَرِيمٌ، يَا مَنْ هُوَ فِي صُنْعِهِ حَكِيمٌ، يَا مَنْ هُوَ فِي حِكْمَتِهِ لَطِيفٌ، يَا مَنْ هُوَ فِي لُطْفِهِ قَدِيمٌ.",
            "يَا مَنْ لَا يُرْجَىٰ إِلَّا فَضْلُهُ، يَا مَنْ لَا يُسْأَلُ إِلَّا عَفْوُهُ، يَا مَنْ لَا يُنْظَرُ إِلَّا بِرُّهُ، يَا مَنْ لَا يُخَافُ إِلَّا عَدْلُهُ، يَا مَنْ لَا يَدُومُ إِلَّا مُلْكُهُ، يَا مَنْ لَا سُلْطَانَ إِلَّا سُلْطَانُهُ، يَا مَنْ وَسِعَتْ كُلَّ شَيْءٍ رَحْمَتُهُ، يَا مَنْ سَبَقَتْ رَحْمَتُهُ غَضَبَهُ، يَا مَنْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمُهُ، يَا مَنْ لَيْسَ أَحَدٌ مِثْلَهُ.",
            "يَا فَارِجَ الْهَمِّ، يَا كَاشِفَ الْغَمِّ، يَا غَافِرَ الذَّنْبِ، يَا قَابِلَ التَّوْبِ، يَا خَالِقَ الْخَلْقِ، يَا صَادِقَ الْوَعْدِ، يَا مُوفِيَ الْعَهْدِ، يَا عَالِمَ السِّرِّ، يَا فَالِقَ الْحَبِّ، يَا رَازِقَ الْأَنَامِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا عَلِيُّ، يَا وَفِيُّ، يَا غَنِيُّ، يَا مَلِيُّ، يَا حَفِيُّ، يَا رَضِيُّ، يَا زَكِيُّ، يَا بَدِيُّ، يَا قَوِيُّ، يَا وَلِيُّ.",
            "يَا مَنْ أَظْهَرَ الْجَمِيلَ، يَا مَنْ سَتَرَ الْقَبِيحَ، يَا مَنْ لَمْ يُؤَاخِذْ بِالْجَرِيرَةِ، يَا مَنْ لَمْ يَهْتِكِ السِّتْرَ، يَا عَظِيمَ الْعَفْوِ، يَا حَسَنَ التَّجَاوُزِ، يَا وَاسِعَ الْمَغْفِرَةِ، يَا بَاسِطَ الْيَدَيْنِ بِالرَّحْمَةِ، يَا صَاحِبَ كُلِّ نَجْوَىٰ، يَا مُنْتَهَىٰ كُلِّ شَكْوَىٰ.",
            "يَا ذَا النِّعْمَةِ السَّابِغَةِ، يَا ذَا الرَّحْمَةِ الْوَاسِعَةِ، يَا ذَا الْمِنَّةِ السَّابِقَةِ، يَا ذَا الْحِكْمَةِ الْبَالِغَةِ، يَا ذَا الْقُدْرَةِ الْكَامِلَةِ، يَا ذَا الْحُجَّةِ الْقَاطِعَةِ، يَا ذَا الْكَرَامَةِ الظَّاهِرَةِ، يَا ذَا الْعِزَّةِ الدَّائِمَةِ، يَا ذَا الْقُوَّةِ الْمَتِينَةِ، يَا ذَا الْعَظَمَةِ الْمَنِيعَةِ.",
            "يَا بَدِيعَ السَّمَاوَاتِ، يَا جَاعِلَ الظُّلُمَاتِ، يَا رَاحِمَ الْعَبَرَاتِ، يَا مُقِيلَ الْعَثَرَاتِ، يَا سَاتِرَ الْعَوْرَاتِ، يَا مُحْيِيَ الْأَمْوَاتِ، يَا مُنْزِلَ الْآيَاتِ، يَا مُضَعِّفَ الْحَسَنَاتِ، يَا مَاحِيَ السَّيِّئَاتِ، يَا شَدِيدَ النَّقِمَاتِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مُصَوِّرُ، يَا مُقَدِّرُ، يَا مُدَبِّرُ، يَا مُطَهِّرُ، يَا مُنَوِّرُ، يَا مُيَسِّرُ، يَا مُبَشِّرُ، يَا مُنْذِرُ، يَا مُقَدِّمُ، يَا مُؤَخِّرُ.",
            "يَا رَبَّ الْبَيْتِ الْحَرَامِ، يَا رَبَّ الشَّهْرِ الْحَرَامِ، يَا رَبَّ الْبَلَدِ الْحَرَامِ، يَا رَبَّ الرُّكْنِ وَالْمَقَامِ، يَا رَبَّ الْمَشْعَرِ الْحَرَامِ، يَا رَبَّ الْمَسْجِدِ الْحَرَامِ، يَا رَبَّ الْحِلِّ وَالْحَرَامِ، يَا رَبَّ النُّورِ وَالظَّلَامِ، يَا رَبَّ التَّحِيَّةِ وَالسَّلَامِ، يَا رَبَّ الْقُدْرَةِ فِي الْأَنَامِ.",
            "يَا أَحْكَمَ الْحَاكِمِينَ، يَا أَعْدَلَ الْعَادِلِينَ، يَا أَصْدَقَ الصَّادِقِينَ، يَا أَطْهَرَ الطَّاهِرِينَ، يَا أَحْسَنَ الْخَالِقِينَ، يَا أَسْرَعَ الْحَاسِبِينَ، يَا أَسْمَعَ السَّامِعِينَ، يَا أَبْصَرَ النَّاظِرِينَ، يَا أَشْفَعَ الشَّافِعِينَ، يَا أَكْرَمَ الْأَكْرَمِينَ.",
            "يَا عِمَادَ مَنْ لَا عِمَادَ لَهُ، يَا سَنَدَ مَنْ لَا سَنَدَ لَهُ، يَا ذُخْرَ مَنْ لَا ذُخْرَ لَهُ، يَا حِرْزَ مَنْ لَا حِرْزَ لَهُ، يَا غِيَاثَ مَنْ لَا غِيَاثَ لَهُ، يَا فَخْرَ مَنْ لَا فَخْرَ لَهُ، يَا عِزَّ مَنْ لَا عِزَّ لَهُ، يَا مُعِينَ مَنْ لَا مُعِينَ لَهُ، يَا أَنِيسَ مَنْ لَا أَنِيسَ لَهُ، يَا أَمَانَ مَنْ لَا أَمَانَ لَهُ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا عَاصِمُ، يَا قَائِمُ، يَا دَائِمُ، يَا رَاحِمُ، يَا سَالِمُ، يَا حَاكِمُ، يَا عَالِمُ، يَا قَاسِمُ، يَا قَابِضُ، يَا بَاسِطُ.",
            "يَا عَاصِمَ مَنِ اسْتَعْصَمَهُ، يَا رَاحِمَ مَنِ اسْتَرْحَمَهُ، يَا غَافِرَ مَنِ اسْتَغْفَرَهُ، يَا نَاصِرَ مَنِ اسْتَنْصَرَهُ، يَا حَافِظَ مَنِ اسْتَحْفَظَهُ، يَا مُكْرِمَ مَنِ اسْتَكْرَمَهُ، يَا مُرْشِدَ مَنِ اسْتَرْشَدَهُ، يَا صَرِيخَ مَنِ اسْتَصْرَخَهُ، يَا مُعِينَ مَنِ اسْتَعَانَهُ، يَا مُغِيثَ مَنِ اسْتَغَاثَهُ.",
            "يَا عَزِيزاً لَا يُضَامُ، يَا لَطِيفاً لَا يُرَامُ، يَا قَيُّوماً لَا يَنَامُ، يَا دَائِماً لَا يَفُوتُ، يَا حَيّاً لَا يَمُوتُ، يَا مَلِكاً لَا يَزُولُ، يَا بَاقِياً لَا يَفْنَىٰ، يَا عَالِماً لَا يَجْهَلُ، يَا صَمَداً لَا يُطْعَمُ، يَا قَوِيّاً لَا يَضْعُفُ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا أَحَدُ، يَا وَاحِدُ، يَا شَاهِدُ، يَا مَاجِدُ، يَا حَامِدُ، يَا رَاشِدُ، يَا بَاعِثُ، يَا وَارِثُ، يَا ضَارُّ، يَا نَافِعُ.",
            "يَا أَعْظَمَ مِنْ كُلِّ عَظِيمٍ، يَا أَكْرَمَ مِنْ كُلِّ كَرِيمٍ، يَا أَرْحَمَ مِنْ كُلِّ رَحِيمٍ، يَا أَعْلَمَ مِنْ كُلِّ عَلِيمٍ، يَا أَحْكَمَ مِنْ كُلِّ حَكِيمٍ، يَا أَقْدَمَ مِنْ كُلِّ قَدِيمٍ، يَا أَكْبَرَ مِنْ كُلِّ كَبِيرٍ، يَا أَلْطَفَ مِنْ كُلِّ لَطِيفٍ، يَا أَجَلَّ مِنْ كُلِّ جَلِيلٍ، يَا أَعَزَّ مِنْ كُلِّ عَزِيزٍ.",
            "يَا كَرِيمَ الصَّفْحِ، يَا عَظِيمَ الْمَنِّ، يَا كَثِيرَ الْخَيْرِ، يَا قَدِيمَ الْفَضْلِ، يَا دَائِمَ اللُّطْفِ، يَا لَطِيفَ الصُّنْعِ، يَا مُنَفِّسَ الْكَرْبِ، يَا كَاشِفَ الضُّرِّ، يَا مَالِكَ الْمُلْكِ، يَا قَاضِيَ الْحَقِّ.",
            "يَا مَنْ هُوَ فِي عَهْدِهِ وَفِيٌّ، يَا مَنْ هُوَ فِي وَفَائِهِ قَوِيٌّ، يَا مَنْ هُوَ فِي قُوَّتِهِ عَلِيٌّ، يَا مَنْ هُوَ فِي عُلُوِّهِ قَرِيبٌ، يَا مَنْ هُوَ فِي قُرْبِهِ لَطِيفٌ، يَا مَنْ هُوَ فِي لُطْفِهِ شَرِيفٌ، يَا مَنْ هُوَ فِي شَرَفِهِ عَزِيزٌ، يَا مَنْ هُوَ فِي عِزِّهِ عَظِيمٌ، يَا مَنْ هُوَ فِي عَظَمَتِهِ مَجِيدٌ، يَا مَنْ هُوَ فِي مَجْدِهِ حَمِيدٌ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا كَافِي، يَا شَافِي، يَا وَافِي، يَا مُعَافِي، يَا هَادِي، يَا دَاعِي، يَا قَاضِي، يَا رَاضِي، يَا عَالِي، يَا بَاقِي.",
            "يَا مَنْ كُلُّ شَيْءٍ خَاضِعٌ لَهُ، يَا مَنْ كُلُّ شَيْءٍ خَاشِعٌ لَهُ، يَا مَنْ كُلُّ شَيْءٍ كَائِنٌ لَهُ، يَا مَنْ كُلُّ شَيْءٍ مَوْجُودٌ بِهِ، يَا مَنْ كُلُّ شَيْءٍ مُنِيبٌ إِلَيْهِ، يَا مَنْ كُلُّ شَيْءٍ خَائِفٌ مِنْهُ، يَا مَنْ كُلُّ شَيْءٍ قَائِمٌ بِهِ، يَا مَنْ كُلُّ شَيْءٍ صَائِرٌ إِلَيْهِ، يَا مَنْ كُلُّ شَيْءٍ يُسَبِّحُ بِحَمْدِهِ، يَا مَنْ كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ.",
            "يَا مَنْ لَا مَفَرَّ إِلَّا إِلَيْهِ، يَا مَنْ لَا مَفْزَعَ إِلَّا إِلَيْهِ، يَا مَنْ لَا مَقْصَدَ إِلَّا إِلَيْهِ، يَا مَنْ لَا مَنْجَا مِنْهُ إِلَّا إِلَيْهِ، يَا مَنْ لَا يُرْغَبُ إِلَّا إِلَيْهِ، يَا مَنْ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِهِ، يَا مَنْ لَا يُسْتَعَانُ إِلَّا بِهِ، يَا مَنْ لَا يُتَوَكَّلُ إِلَّا عَلَيْهِ، يَا مَنْ لَا يُرْجَىٰ إِلَّا هُوَ، يَا مَنْ لَا يُعْبَدُ إِلَّا هُوَ.",
            "يَا خَيْرَ الْمَرْهُوبِينَ، يَا خَيْرَ الْمَرْغُوبِينَ، يَا خَيْرَ الْمَطْلُوبِينَ، يَا خَيْرَ الْمَسْؤُولِينَ، يَا خَيْرَ الْمَقْصُودِينَ، يَا خَيْرَ الْمَذْكُورِينَ، يَا خَيْرَ الْمَشْكُورِينَ، يَا خَيْرَ الْمَحْبُوبِينَ، يَا خَيْرَ الْمَدْعُوِّينَ، يَا خَيْرَ الْمُسْتَأْنِسِينَ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا غَافِرُ، يَا سَاتِرُ، يَا قَادِرُ، يَا قَاهِرُ، يَا فَاطِرُ، يَا كَاسِرُ، يَا جَابِرُ، يَا ذَاكِرُ، يَا نَاظِرُ، يَا نَاصِرُ.",
            "يَا مَنْ خَلَقَ فَسَوَّىٰ، يَا مَنْ قَدَّرَ فَهَدَىٰ، يَا مَنْ يَكْشِفُ الْبَلْوَىٰ، يَا مَنْ يَسْمَعُ النَّجْوَىٰ، يَا مَنْ يُنْقِذُ الْغَرْقَىٰ، يَا مَنْ يُنْجِي الْهَلْكَىٰ، يَا مَنْ يَشْفِي الْمَرْضَىٰ، يَا مَنْ أَضْحَكَ وَأَبْكَىٰ، يَا مَنْ أَمَاتَ وَأَحْيَاٰ، يَا مَنْ خَلَقَ الزَّوْجَيْنِ الذَّكَرَ وَالْأُنْثَىٰ.",
            "يَا مَنْ فِي الْبَرِّ وَالْبَحْرِ سَبِيلُهُ، يَا مَنْ فِي الْآفَاقِ آيَاتُهُ، يَا مَنْ فِي الْآيَاتِ بُرْهَانُهُ، يَا مَنْ فِي الْمَمَاتِ قُدْرَتُهُ، يَا مَنْ فِي الْقُبُورِ عِبْرَتُهُ، يَا مَنْ فِي الْقِيَامَةِ مُلْكُهُ، يَا مَنْ فِي الْحِسَابِ هَيْبَتُهُ، يَا مَنْ فِي الْمِيزَانِ قَضَاؤُهُ، يَا مَنْ فِي الْجَنَّةِ ثَوَابُهُ، يَا مَنْ فِي النَّارِ عِقَابُهُ.",
            "يَا مَنْ إِلَيْهِ يَهْرَبُ الْخَائِفُونَ، يَا مَنْ إِلَيْهِ يَفْزَعُ الْمُذْنِبُونَ، يَا مَنْ إِلَيْهِ يَقْصِدُ الْمُنِيبُونَ، يَا مَنْ إِلَيْهِ يَرْغَبُ الزَّاهِدُونَ، يَا مَنْ إِلَيْهِ يَلْجَأُ الْمُتَحَيِّرُونَ، يَا مَنْ بِهِ يَسْتَأْنِسُ الْمُرِيدُونَ، يَا مَنْ بِهِ يَفْتَخِرُ الْمُحِبُّونَ، يَا مَنْ فِي عَفْوِهِ يَطْمَعُ الْخَاطِئُونَ، يَا مَنْ إِلَيْهِ يَسْكُنُ الْمُوقِنُونَ، يَا مَنْ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا حَبِيبُ، يَا طَبِيبُ، يَا قَرِيبُ، يَا رَقِيبُ، يَا حَسِيبُ، يَا مُهِيبُ، يَا مُثِيبُ، يَا مُجِيبُ، يَا خَبِيرُ، يَا بَصِيرُ.",
            "يَا أَقْرَبَ مِنْ كُلِّ قَرِيبٍ، يَا أَحَبَّ مِنْ كُلِّ حَبِيبٍ، يَا أَبْصَرَ مِنْ كُلِّ بَصِيرٍ، يَا أَخْبَرَ مِنْ كُلِّ خَبِيرٍ، يَا أَشْرَفَ مِنْ كُلِّ شَرِيفٍ، يَا أَرْفَعَ مِنْ كُلِّ رَفِيعٍ، يَا أَقْوَىٰ مِنْ كُلِّ قَوِيٍّ، يَا أَغْنَىٰ مِنْ كُلِّ غَنِيٍّ، يَا أَجْوَدَ مِنْ كُلِّ جَوَادٍ، يَا أَرْأَفَ مِنْ كُلِّ رَؤُوفٍ.",
            "يَا غَالِباً غَيْرَ مَغْلُوبٍ، يَا صَانِعاً غَيْرَ مَصْنُوعٍ، يَا خَالِقاً غَيْرَ مَخْلُوقٍ، يَا مَالِكاً غَيْرَ مَمْلُوكٍ، يَا قَاهِراً غَيْرَ مَقْهُورٍ، يَا رَافِعاً غَيْرَ مَرْفُوعٍ، يَا حَافِظاً غَيْرَ مَحْفُوظٍ، يَا نَاصِراً غَيْرَ مَنْصُورٍ، يَا شَاهِداً غَيْرَ غَائِبٍ، يَا قَرِيباً غَيْرَ بَعِيدٍ.",
            "يَا نُورَ النُّورِ، يَا مُنَوِّرَ النُّورِ، يَا خَالِقَ النُّورِ، يَا مُدَبِّرَ النُّورِ، يَا مُقَدِّرَ النُّورِ، يَا نُورَ كُلِّ نُورٍ، يَا نُوراً قَبْلَ كُلِّ نُورٍ، يَا نُوراً بَعْدَ كُلِّ نُورٍ، يَا نُوراً فَوْقَ كُلِّ نُورٍ، يَا نُوراً لَيْسَ كَمِثْلِهِ نُورٌ.",
            "يَا مَنْ عَطَاؤُهُ شَرِيفٌ، يَا مَنْ فِعْلُهُ لَطِيفٌ، يَا مَنْ لُطْفُهُ مُقِيمٌ، يَا مَنْ إِحْسَانُهُ قَدِيمٌ، يَا مَنْ قَوْلُهُ حَقٌّ، يَا مَنْ وَعْدُهُ صِدْقٌ، يَا مَنْ عَفْوُهُ فَضْلٌ، يَا مَنْ عَذَابُهُ عَدْلٌ، يَا مَنْ ذِكْرُهُ حُلْوٌ، يَا مَنْ فَضْلُهُ عَمِيمٌ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مُسَهِّلُ، يَا مُفَصِّلُ، يَا مُبَدِّلُ، يَا مُذَلِّلُ، يَا مُنَزِّلُ، يَا مُنَوِّلُ، يَا مُفْضِلُ، يَا مُجْزِلُ، يَا مُمْهِلُ، يَا مُجْمِلُ.",
            "يَا مَنْ يَرَىٰ وَلَا يُرَىٰ، يَا مَنْ يَخْلُقُ وَلَا يُخْلَقُ، يَا مَنْ يَهْدِي وَلَا يُهْدَىٰ، يَا مَنْ يُحْيِي وَلَا يُحْيَاٰ، يَا مَنْ يُسْأَلُ وَلَا يُسْأَلُ، يَا مَنْ يُطْعِمُ وَلَا يُطْعَمُ، يَا مَنْ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ، يَا مَنْ يَقْضِي وَلَا يُقْضَىٰ عَلَيْهِ، يَا مَنْ يَحْكُمُ وَلَا يُحْكَمُ عَلَيْهِ، يَا مَنْ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُواً أَحَدٌ.",
            "يَا نِعْمَ الْحَسِيبُ، يَا نِعْمَ الطَّبِيبُ، يَا نِعْمَ الرَّقِيبُ، يَا نِعْمَ الْقَرِيبُ، يَا نِعْمَ الْمُجِيبُ، يَا نِعْمَ الْحَبِيبُ، يَا نِعْمَ الْكَفِيلُ، يَا نِعْمَ الْوَكِيلُ، يَا نِعْمَ الْمَوْلَىٰ، يَا نِعْمَ النَّصِيرُ.",
            "يَا سُرُورَ الْعَارِفِينَ، يَا مُنَىٰ الْمُحِبِّينَ، يَا أَنِيسَ الْمُرِيدِينَ، يَا حَبِيبَ التَّوَّابِينَ، يَا رَازِقَ الْمُقِلِّينَ، يَا رَجَاءَ الْمُذْنِبِينَ، يَا قُرَّةَ عَيْنِ الْعَابِدِينَ، يَا مُنَفِّسَ عَنِ الْمَكْرُوبِينَ، يَا مُفَرِّجَ عَنِ الْمَغْمُومِينَ، يَا إِلٰهَ الْأَوَّلِينَ وَالْآخِرِينَ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا رَبَّنَا، يَا إِلٰهَنَا، يَا سَيِّدَنَا، يَا مَوْلَانَا، يَا نَاصِرَنَا، يَا حَافِظَنَا، يَا دَلِيلَنَا، يَا مُعِينَنَا، يَا حَبِيبَنَا، يَا طَبِيبَنَا.",
            "يَا رَبَّ النَّبِيِّينَ وَالْأَبْرَارِ، يَا رَبَّ الصِّدِّيقِينَ وَالْأَخْيَارِ، يَا رَبَّ الْجَنَّةِ وَالنَّارِ، يَا رَبَّ الصِّغَارِ وَالْكِبَارِ، يَا رَبَّ الْحُبُوبِ وَالثِّمَارِ، يَا رَبَّ الْأَنْهَارِ وَالْأَشْجَارِ، يَا رَبَّ الصَّحَارِي وَالْقِفَارِ، يَا رَبَّ الْبَرَارِي وَالْبِحَارِ، يَا رَبَّ اللَّيْلِ وَالنَّهَارِ، يَا رَبَّ الْأَعْلَانِ وَالْأَسْرَارِ.",
            "يَا مَنْ نَفَذَ فِي كُلِّ شَيْءٍ أَمْرُهُ، يَا مَنْ لَحِقَ بِكُلِّ شَيْءٍ عِلْمُهُ، يَا مَنْ بَلَغَتْ إِلَىٰ كُلِّ شَيْءٍ قُدْرَتُهُ، يَا مَنْ لَا تُحْصِي الْعِبَادُ نِعَمَهُ، يَا مَنْ لَا تَبْلُغُ الْخَلَائِقُ شُكْرَهُ، يَا مَنْ لَا تُدْرِكُ الْأَفْهَامُ جَلَالَهُ، يَا مَنْ لَا تَنَالُ الْأَوْهَامُ كُنْهَهُ، يَا مَنْ الْعَظَمَةُ وَالْكِبْرِيَاءُ رِدَاؤُهُ، يَا مَنْ لَا تَرُدُّ الْعِبَادُ قَضَاءَهُ، يَا مَنْ لَا مُلْكَ إِلَّا مُلْكُهُ، يَا مَنْ لَا عَطَاءَ إِلَّا عَطَاؤُهُ.",
            "يَا مَنْ لَهُ الْمَثَلُ الْأَعْلَىٰ، يَا مَنْ لَهُ الصِّفَاتُ الْعُلْيَا، يَا مَنْ لَهُ الْآخِرَةُ وَالْأُولَىٰ، يَا مَنْ لَهُ الْجَنَّةُ الْمَأْوَىٰ، يَا مَنْ لَهُ الْآيَاتُ الْكُبْرَىٰ، يَا مَنْ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ، يَا مَنْ لَهُ الْحُكْمُ وَالْقَضَاءُ، يَا مَنْ لَهُ الْهَوَاءُ وَالْفَضَاءُ، يَا مَنْ لَهُ الْعَرْشُ وَالثَّرَىٰ، يَا مَنْ لَهُ السَّمَاوَاتُ الْعُلَىٰ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا عَفُوُّ، يَا غَفُورُ، يَا صَبُورُ، يَا شَكُورُ، يَا رَؤُوفُ، يَا عَطُوفُ، يَا مَسْؤُولُ، يَا وَدُودُ، يَا سُبُّوحُ، يَا قُدُّوسُ.",
            "يَا مَنْ فِي السَّمَاءِ عَظَمَتُهُ، يَا مَنْ فِي الْأَرْضِ آيَاتُهُ، يَا مَنْ فِي كُلِّ شَيْءٍ دَلَائِلُهُ، يَا مَنْ فِي الْبِحَارِ عَجَائِبُهُ، يَا مَنْ فِي الْجِبَالِ خَزَائِنُهُ، يَا مَنْ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ، يَا مَنْ إِلَيْهِ يَرْجِعُ الْأَمْرُ كُلُّهُ، يَا مَنْ أَظْهَرَ فِي كُلِّ شَيْءٍ لُطْفَهُ، يَا مَنْ أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ، يَا مَنْ تَصَرَّفَ فِي الْخَلَائِقِ قُدْرَتُهُ.",
            "يَا حَبِيبَ مَنْ لَا حَبِيبَ لَهُ، يَا طَبِيبَ مَنْ لَا طَبِيبَ لَهُ، يَا مُجِيبَ مَنْ لَا مُجِيبَ لَهُ، يَا شَفِيقَ مَنْ لَا شَفِيقَ لَهُ، يَا رَفِيقَ مَنْ لَا رَفِيقَ لَهُ، يَا مُغِيثَ مَنْ لَا مُغِيثَ لَهُ، يَا دَلِيلَ مَنْ لَا دَلِيلَ لَهُ، يَا أَنِيسَ مَنْ لَا أَنِيسَ لَهُ، يَا رَاحِمَ مَنْ لَا رَاحِمَ لَهُ، يَا صَاحِبَ مَنْ لَا صَاحِبَ لَهُ.",
            "يَا كَافِيَ مَنِ اسْتَكْفَاهُ، يَا هَادِيَ مَنِ اسْتَهْدَاهُ، يَا كَالِيَ مَنِ اسْتَكْلَاهُ، يَا رَاعِيَ مَنِ اسْتَرْعَاهُ، يَا شَافِيَ مَنِ اسْتَشْفَاهُ، يَا قَاضِيَ مَنِ اسْتَقْضَاهُ، يَا مُغْنِيَ مَنِ اسْتَغْنَاهُ، يَا مُوفِيَ مَنِ اسْتَوْفَاهُ، يَا مُقَوِّيَ مَنِ اسْتَقْوَاهُ، يَا وَلِيَّ مَنِ اسْتَوْلَاهُ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا خَالِقُ، يَا رَازِقُ، يَا نَاطِقُ، يَا صَادِقُ، يَا فَالِقُ، يَا فَارِقُ، يَا فَاتِقُ، يَا رَاتِقُ، يَا سَابِقُ، يَا سَامِقُ.",
            "يَا مَنْ يُقَلِّبُ اللَّيْلَ وَالنَّهَارَ، يَا مَنْ جَعَلَ الظُّلُمَاتِ وَالْأَنْوَارَ، يَا مَنْ خَلَقَ الظِّلَّ وَالْحَرُورَ، يَا مَنْ سَخَّرَ الشَّمْسَ وَالْقَمَرَ، يَا مَنْ قَدَّرَ الْخَيْرَ وَالشَّرَّ، يَا مَنْ خَلَقَ الْمَوْتَ وَالْحَيَاةَ، يَا مَنْ لَهُ الْخَلْقُ وَالْأَمْرُ، يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَداً، يَا مَنْ لَيْسَ لَهُ شَرِيكٌ فِي الْمُلْكِ، يَا مَنْ لَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ.",
            "يَا مَنْ يَعْلَمُ مُرَادَ الْمُرِيدِينَ، يَا مَنْ يَعْلَمُ ضَمِيرَ الصَّامِتِينَ، يَا مَنْ يَسْمَعُ أَنِينَ الْوَاهِنِينَ، يَا مَنْ يَرَىٰ بُكَاءَ الْخَائِفِينَ، يَا مَنْ يَمْلِكُ حَوَائِجَ السَّائِلِينَ، يَا مَنْ يَقْبَلُ عُذْرَ التَّائِبِينَ، يَا مَنْ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ، يَا مَنْ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ، يَا مَنْ لَا يَبْعُدُ عَنْ قُلُوبِ الْعَارِفِينَ، يَا أَجْوَدَ الْأَجْوَدِينَ.",
            "يَا دَائِمَ الْبَقَاءِ، يَا سَامِعَ الدُّعَاءِ، يَا وَاسِعَ الْعَطَاءِ، يَا غَافِرَ الْخَطَاءِ، يَا بَدِيعَ السَّمَاءِ، يَا حَسَنَ الْبَلَاءِ، يَا جَمِيلَ الثَّنَاءِ، يَا قَدِيمَ السَّنَاءِ، يَا كَثِيرَ الْوَفَاءِ، يَا شَرِيفَ الْجَزَاءِ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا سَتَّارُ، يَا غَفَّارُ، يَا قَهَّارُ، يَا جَبَّارُ، يَا صَبَّارُ، يَا بَارُّ، يَا مُخْتَارُ، يَا فَتَّاحُ، يَا نَفَّاحُ، يَا مُرْتَاحُ.",
            "يَا مَنْ خَلَقَنِي وَسَوَّانِي، يَا مَنْ رَزَقَنِي وَرَبَّانِي، يَا مَنْ أَطْعَمَنِي وَسَقَانِي، يَا مَنْ قَرَّبَنِي وَأَدْنَانِي، يَا مَنْ عَصَمَنِي وَكَفَانِي، يَا مَنْ حَفِظَنِي وَكَلَانِي، يَا مَنْ أَعَزَّنِي وَأَغْنَانِي، يَا مَنْ وَفَّقَنِي وَهَدَانِي، يَا مَنْ آنَسَنِي وَآوَانِي، يَا مَنْ أَمَاتَنِي وَأَحْيَانِي.",
            "يَا مَنْ يُحِقُّ الْحَقَّ بِكَلِمَاتِهِ، يَا مَنْ يَقْبَلُ التَّوْبَةَ عَنْ عِبَادِهِ، يَا مَنْ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ، يَا مَنْ لَا تَنْفَعُ الشَّفَاعَةُ إِلَّا بِإِذْنِهِ، يَا مَنْ هُوَ أَعْلَمُ بِمَنْ ضَلَّ عَنْ سَبِيلِهِ، يَا مَنْ لَا مُعَقِّبَ لِحُكْمِهِ، يَا مَنْ لَا رَادَّ لِقَضَائِهِ، يَا مَنِ انْقَادَ كُلُّ شَيْءٍ لِأَمْرِهِ، يَا مَنِ السَّمَاوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ، يَا مَنْ يُرْسِلُ الرِّيَاحَ بُشْراً بَيْنَ يَدَيْ رَحْمَتِهِ.",
            "يَا مَنْ جَعَلَ الْأَرْضَ مِهَاداً، يَا مَنْ جَعَلَ الْجِبَالَ أَوْتَاداً، يَا مَنْ جَعَلَ الشَّمْسَ سِرَاجاً، يَا مَنْ جَعَلَ الْقَمَرَ نُوراً، يَا مَنْ جَعَلَ اللَّيْلَ لِبَاساً، يَا مَنْ جَعَلَ النَّهَارَ مَعَاشاً، يَا مَنْ جَعَلَ النَّوْمَ سُبَاتاً، يَا مَنْ جَعَلَ السَّمَاءَ بِنَاءً، يَا مَنْ جَعَلَ الْأَشْيَاءَ أَزْوَاجاً، يَا مَنْ جَعَلَ النَّارَ مِرْصَاداً.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا سَمِيعُ، يَا شَفِيعُ، يَا رَفِيعُ، يَا مَنِيعُ، يَا سَرِيعُ، يَا بَدِيعُ، يَا كَبِيرُ، يَا قَدِيرُ، يَا خَبِيرُ، يَا مُجِيرُ.",
            "يَا حَيّاً قَبْلَ كُلِّ حَيٍّ، يَا حَيّاً بَعْدَ كُلِّ حَيٍّ، يَا حَيُّ الَّذِي لَيْسَ كَمِثْلِهِ حَيٌّ، يَا حَيُّ الَّذِي لَا يُشَارِكُهُ حَيٌّ، يَا حَيُّ الَّذِي لَا يَحْتَجُ إِلَىٰ حَيٍّ، يَا حَيُّ الَّذِي يُمِيتُ كُلَّ حَيٍّ، يَا حَيُّ الَّذِي يَرْزُقُ كُلَّ حَيٍّ، يَا حَيّاً لَمْ يَرِثِ الْحَيَاةَ مِنْ حَيٍّ، يَا حَيُّ الَّذِي يُحْيِي الْمَوْتَىٰ، يَا حَيُّ يَا قَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ.",
            "يَا مَنْ لَهُ ذِكْرٌ لَا يُنْسَىٰ، يَا مَنْ لَهُ نُورٌ لَا يُطْفَىٰ، يَا مَنْ لَهُ نِعَمٌ لَا تُعَدُّ، يَا مَنْ لَهُ مُلْكٌ لَا يَزُولُ، يَا مَنْ لَهُ ثَنَاءٌ لَا يُحْصَىٰ، يَا مَنْ لَهُ جَلَالٌ لَا يُكَيَّفُ، يَا مَنْ لَهُ كَمَالٌ لَا يُدْرَكُ، يَا مَنْ لَهُ قَضَاءٌ لَا يُرَدُّ، يَا مَنْ لَهُ صِفَاتٌ لَا تُبَدَّلُ، يَا مَنْ لَهُ نُعُوتٌ لَا تُغَيَّرُ.",
            "يَا رَبَّ الْعَالَمِينَ، يَا مَالِكَ يَوْمِ الدِّينِ، يَا غَايَةَ الطَّالِبِينَ، يَا ظَهْرَ اللَّاجِينَ، يَا مُدْرِكَ الْهَارِبِينَ، يَا مَنْ يُحِبُّ الصَّابِرِينَ، يَا مَنْ يُحِبُّ التَّوَّابِينَ، يَا مَنْ يُحِبُّ الْمُتَطَهِّرِينَ، يَا مَنْ يُحِبُّ الْمُحْسِنِينَ، يَا مَنْ هُوَ أَعْلَمُ بِالْمُهْتَدِينَ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا شَفِيقُ، يَا رَفِيقُ، يَا حَفِيظُ، يَا مُحِيطُ، يَا مُقِيتُ، يَا مُغِيثُ، يَا مُعِزُّ، يَا مُذِلُّ، يَا مُبْدِئُ، يَا مُعِيدُ.",
            "يَا مَنْ هُوَ أَحَدٌ بِلا ضِدٍّ، يَا مَنْ هُوَ فَرْدٌ بِلا نِدٍّ، يَا مَنْ هُوَ صَمَدٌ بِلا عَيْبٍ، يَا مَنْ هُوَ وِتْرٌ بِلا كَيْفٍ، يَا مَنْ هُوَ قَاضٍ بِلا حَيْفٍ، يَا مَنْ هُوَ رَبٌّ بِلا وَزِيرٍ، يَا مَنْ هُوَ عَزِيزٌ.",
            "يَا مَنْ أَنْعَمَ بِطَوْلِهِ، يَا مَنْ أَكْرَمَ بِجُودِهِ، يَا مَنْ جَادَ بِلُطْفِهِ، يَا مَنْ تَعَزَّزَ بِقُدْرَتِهِ، يَا مَنْ قَدَّرَ بِحِكْمَتِهِ، يَا مَنْ حَكَمَ بِتَدْبِيرِهِ، يَا مَنْ دَبَّرَ بِعِلْمِهِ، يَا مَنْ تَجَاوَزَ بِحِلْمِهِ، يَا مَنْ دَنَا فِي عُلُوِّهِ، يَا مَنْ عَلَا فِي دُنُوِّهِ.",
            "يَا مَنْ يَخْلُقُ مَا يَشَاءُ، يَا مَنْ يَفْعَلُ مَا يَشَاءُ، يَا مَنْ يَهْدِي مَنْ يَشَاءُ، يَا مَنْ يُضِلُّ مَنْ يَشَاءُ، يَا مَنْ يُعَذِّبُ مَنْ يَشَاءُ، يَا مَنْ يَغْفِرُ لِمَنْ يَشَاءُ، يَا مَنْ يُعِزُّ مَنْ يَشَاءُ، يَا مَنْ يُذِلُّ مَنْ يَشَاءُ، يَا مَنْ يُصَوِّرُ فِي الْأَرْحَامِ مَا يَشَاءُ، يَا مَنْ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَاءُ.",
            "يَا مَنْ لَمْ يَتَّخِذْ صَاحِبَةً وَلَا وَلَداً، يَا مَنْ جَعَلَ لِكُلِّ شَيْءٍ قَدْراً، يَا مَنْ لَا يُشْرِكُ فِي حُكْمِهِ أَحَداً، يَا مَنْ جَعَلَ الْمَلَائِكَةَ رُسُلًا، يَا مَنْ جَعَلَ فِي السَّمَاءِ بُرُوجاً، يَا مَنْ جَعَلَ الْأَرْضَ قَرَاراً، يَا مَنْ خَلَقَ مِنَ الْمَاءِ بَشَراً، يَا مَنْ جَعَلَ لِكُلِّ شَيْءٍ أَمَداً، يَا مَنْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْماً، يَا مَنْ أَحْصَىٰ كُلَّ شَيْءٍ عَدَدَ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا أَوَّلُ، يَا آخِرُ، يَا ظَاهِرُ، يَا بَاطِنُ، يَا بَرُّ، يَا حَقُّ، يَا فَرْدُ، يَا وِتْرُ، يَا صَمَدُ، يَا سَرْمَدُ.",
            "يَا خَيْرَ مَعْرُوفٍ عُرِفَ، يَا أَفْضَلَ مَعْبُودٍ عُبِدَ، يَا أَجَلَّ مَشْكُورٍ شُكِرَ، يَا أَعَزَّ مَذْكُورٍ ذُكِرَ، يَا أَعْلَىٰ مَحْمُودٍ حُمِدَ، يَا أَقْدَمَ مَوْجُودٍ طُلِبَ، يَا أَرْفَعَ مَوْصُوفٍ وُصِفَ، يَا أَكْبَرَ مَقْصُودٍ قُصِدَ، يَا أَكْرَمَ مَسْؤُولٍ سُئِلَ، يَا أَشْرَفَ مَحْبُوبٍ عُلِمَ.",
            "يَا حَبِيبَ الْبَاكِينَ، يَا سَيِّدَ الْمُتَوَكِّلِينَ، يَا هَادِيَ الْمُضِلِّينَ، يَا وَلِيَّ الْمُؤْمِنِينَ، يَا أَنِيسَ الذَّاكِرِينَ، يَا مَفْزَعَ الْمَلْهُوفِينَ، يَا مُنْجِيَ الصَّادِقِينَ، يَا أَقْدَرَ الْقَادِرِينَ، يَا أَعْلَمَ الْعَالَمِينَ، يَا إِلٰهَ الْخَلْقِ أَجْمَعِينَ.",
            "يَا مَنْ عَلَا فَقَهَرَ، يَا مَنْ مَلَكَ فَقَدَرَ، يَا مَنْ بَطَنَ فَخَبَرَ، يَا مَنْ عُبِدَ فَشَكَرَ، يَا مَنْ عُصِيَ فَغَفَرَ، يَا مَنْ لَا تَحْوِيهِ الْفِكَرُ، يَا مَنْ لَا يُدْرِكُهُ بَصَرٌ، يَا مَنْ لَا يَخْفَىٰ عَلَيْهِ أَثَرٌ، يَا رَازِقَ الْبَشَرِ، يَا مُقَدِّرَ كُلِّ قَدَرٍ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا حَافِظُ، يَا بَارِئُ، يَا ذَارِئُ، يَا بَاذِخُ، يَا فَارِجُ، يَا فَاتِحُ، يَا كَاشِفُ، يَا ضَامِنُ، يَا آمِرُ، يَا نَاهِي.",
            "يَا مَنْ لَا يَعْلَمُ الْغَيْبَ إِلَّا هُوَ، يَا مَنْ لَا يَصْرِفُ السُّوءَ إِلَّا هُوَ، يَا مَنْ لَا يَخْلُقُ الْخَلْقَ إِلَّا هُوَ، يَا مَنْ لَا يَغْفِرُ الذَّنْبَ إِلَّا هُوَ، يَا مَنْ لَا يُتِمُّ النِّعْمَةَ إِلَّا هُوَ، يَا مَنْ لَا يُقَلِّبُ الْقُلُوبَ إِلَّا هُوَ، يَا مَنْ لَا يُدَبِّرُ الْأَمْرَ إِلَّا هُوَ، يَا مَنْ لَا يُنَزِّلُ الْغَيْثَ إِلَّا هُوَ، يَا مَنْ لَا يَبْسُطُ الرِّزْقَ إِلَّا هُوَ، يَا مَنْ لَا يُحْيِي الْمَوْتَىٰ إِلَّا هُوَ.",
            "يَا مُعِينَ الضُّعَفَاءِ، يَا صَاحِبَ الْغُرَبَاءِ، يَا نَاصِرَ الْأَوْلِيَاءِ، يَا قَاهِرَ الْأَعْدَاءِ، يَا رَافِعَ السَّمَاءِ، يَا أَنِيسَ الْأَصْفِيَاءِ، يَا حَبِيبَ الْأَتْقِيَاءِ، يَا كَنْزَ الْفُقَرَاءِ، يَا إِلٰهَ الْأَغْنِيَاءِ، يَا أَكْرَمَ الْكُرَمَاءِ.",
            "يَا كَافياً مِنْ كُلِّ شَيْءٍ، يَا قَائِماً عَلَىٰ كُلِّ شَيْءٍ، يَا مَنْ لَا يُشْبِهُهُ شَيْءٌ، يَا مَنْ لَا يَزِيدُ فِي مُلْكِهِ شَيْءٌ، يَا مَنْ لَا يَخْفَىٰ عَلَيْهِ شَيْءٌ، يَا مَنْ لَا يَنْقُصُ مِنْ خَزَائِنِهِ شَيْءٌ، يَا مَنْ لَيْسَ كَمِثْلِهِ شَيْءٌ، يَا مَنْ لَا يَعْزُبُ عَنْ عِلْمِهِ شَيْءٌ، يَا مَنْ هُوَ خَبِيرٌ بِكُلِّ شَيْءٍ، يَا مَنْ وَسِعَتْ رَحْمَتُهُ كُلَّ شَيْءٍ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مُكْرِمُ، يَا مُطْعِمُ، يَا مُنْعِمُ، يَا مُعْطِي، يَا مُغْنِي، يَا مُقْنِي، يَا مُفْنِي، يَا مُحْيِي، يَا مُرْضِي، يَا مُنْجِي.",
            "يَا أَوَّلَ كُلِّ شَيْءٍ وَآخِرَهُ، يَا إِلٰهَ كُلِّ شَيْءٍ وَمَلِيكَهُ، يَا رَبَّ كُلِّ شَيْءٍ وَصَانِعَهُ، يَا بَارِئَ كُلِّ شَيْءٍ وَخَالِقَهُ، يَا قَابِضَ كُلِّ شَيْءٍ وَبَاسِطَهُ، يَا مُبْدِئَ كُلِّ شَيْءٍ وَمُعِيدَهُ، يَا مُنْشِئَ كُلِّ شَيْءٍ وَمُقَدِّرَهُ، يَا مُكَوِّنَ كُلِّ شَيْءٍ وَمُحَوِّلَهُ، يَا مُحْيِي كُلِّ شَيْءٍ وَمُمِيتَهُ، يَا خَالِقَ كُلِّ شَيْءٍ وَوَارِثَهُ.",
            "يَا خَيْرَ ذَاكِرٍ وَمَذْكُورٍ، يَا خَيْرَ شَاكِرٍ وَمَشْكُورٍ، يَا خَيْرَ حَامِدٍ وَمَحْمُودٍ، يَا خَيْرَ شَاهِدٍ وَمَشْهُودٍ، يَا خَيْرَ دَاعٍ وَمَدْعُوٍّ، يَا خَيْرَ مُجِيبٍ وَمُجَابٍ، يَا خَيْرَ مُؤْنِسٍ وَأَنِيسٍ، يَا خَيْرَ صَاحِبٍ وَجَلِيسٍ، يَا خَيْرَ مَقْصُودٍ وَمَطْلُوبٍ، يَا خَيْرَ حَبِيبٍ وَمَحْبُوبٍ.",
            "يَا مَنْ هُوَ لِمَنْ دَعَاهُ مُجِيبٌ، يَا مَنْ هُوَ لِمَنْ أَطَاعَهُ حَبِيبٌ، يَا مَنْ هُوَ إِلَىٰ مَنْ أَحَبَّهُ قَرِيبٌ، يَا مَنْ هُوَ بِمَنِ اسْتَحْفَظَهُ رَقِيبٌ، يَا مَنْ هُوَ بِمَنْ رَجَاهُ كَرِيمٌ، يَا مَنْ هُوَ بِمَنْ عَصَاهُ حَلِيمٌ، يَا مَنْ هُوَ فِي عَظَمَتِهِ رَحِيمٌ، يَا مَنْ هُوَ فِي حِكْمَتِهِ عَظِيمٌ، يَا مَنْ هُوَ فِي إِحْسَانِهِ قَدِيمٌ، يَا مَنْ هُوَ بِمَنْ أَرَادَهُ عَلِيمٌ.",
            "أَللَّهُمَّ إِنِّي أَسْأَلُكَ بِاسْمِكَ: يَا مُسَبِّبُ، يَا مُرَغِّبُ، يَا مُقَلِّبُ، يَا مُعَقِّبُ، يَا مُرَتِّبُ، يَا مُخَوِّفُ، يَا مُحَذِّرُ، يَا مُذَكِّرُ، يَا مُسَخِّرُ، يَا مُغَيِّرُ.",
            "يَا مَنْ عِلْمُهُ سَابِقٌ، يَا مَنْ وَعْدُهُ صَادِقٌ، يَا مَنْ لُطْفُهُ ظَاهِرٌ، يَا مَنْ أَمْرُهُ غَالِبٌ، يَا مَنْ كِتَابُهُ مُحْكَمٌ، يَا مَنْ قَضَاؤُهُ كَائِنٌ، يَا مَنْ قُرْآنُهُ مَجِيدٌ، يَا مَنْ مُلْكُهُ قَدِيمٌ، يَا مَنْ فَضْلُهُ عَمِيمٌ، يَا مَنْ عَرْشُهُ عَظِيمٌ.",
            "يَا مَنْ لَا يَشْغَلُهُ سَمْعٌ عَنْ سَمْعٍ، يَا مَنْ لَا يَمْنَعُهُ فِعْلٌ عَنْ فِعْلٍ، يَا مَنْ لَا يُلْهِيهِ قَوْلٌ عَنْ قَوْلٍ، يَا مَنْ لَا يُغَلِّطُهُ سُؤَالٌ عَنْ سُؤَالٍ، يَا مَنْ لَا يَحْجُبُهُ شَيْءٌ عَنْ شَيْءٍ، يَا مَنْ لَا يُبْرِمُهُ إِلْحَاحُ الْمُلِحِّينَ، يَا مَنْ هُوَ غَايَةُ مُرَادِ الْمُرِيدِينَ، يَا مَنْ هُوَ مُنْتَهَىٰ هِمَمِ الْعَارِفِينَ، يَا مَنْ هُوَ مُنْتَهَىٰ طَلَبِ الطَّالِبِينَ، يَا مَنْ لَا يَخْفَىٰ عَلَيْهِ ذَرَّةٌ فِي الْعَالَمِينَ.",
            "يَا حَلِيماً لَا يَعْجَلُ، يَا جَوَاداً لَا يَبْخَلُ، يَا صَادِقاً لَا يُخْلِفُ، يَا وَهَّاباً لَا يَمَلُّ، يَا قَاهِراً لَا يُغْلَبُ، يَا عَظِيماً لَا يُوصَفُ، يَا عَدْلًا لَا يَحِيفُ، يَا غَنِيّاً لَا يَفْتَقِرُ، يَا كَبِيراً لَا يَصْغُرُ، يَا حَافِظاً لَا يَغْفُلُ.<br><br>سُبْحَانَكَ يَا لَا إِلٰهَ إِلَّا أَنْتَ، يَا غِيَاثَ المُسْتَغِيثِينَ أَغِثْنِي، خَلِّصْنَا مِنَ النَّارِ يَا رَبِّ."
        ];

        const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        function toArabic(num) {
            return num.toString().split('').map(d => arabicNumbers[parseInt(d)]).join('');
        }

        const container = document.getElementById('duasContainer');
        duas.forEach((dua, index) => {
            const section = document.createElement('div');
            section.className = 'dua-section';
            section.style.animationDelay = `${index * 0.05}s`;
            section.innerHTML = `
                <div class="dua-number">${toArabic(index + 1)}</div>
                <div class="dua-text">${dua}</div>
                <div class="closing">✦ ياذا الجلال والإكرام اكرمني بقدر رحمة الله الرحمن الرحيم ✦</div>
            `;
            container.appendChild(section);

            if (index < duas.length - 1) {
                const sep = document.createElement('div');
                sep.className = 'separator';
                sep.textContent = '✧•°๑๑❁๑๑°•✧';
                container.appendChild(sep);
            }
        });

        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";

            let backToTopBtn = document.getElementById("backToTop");
            if (winScroll > 300) {
                backToTopBtn.classList.remove("hidden");
            } else {
                backToTopBtn.classList.add("hidden");
            }

            updateDuaCounter();
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            let icon = document.getElementById('darkModeIcon');
            let text = document.getElementById('darkModeText');
            
            if (document.body.classList.contains('dark-mode')) {
                icon.textContent = '☀️';
                text.textContent = 'الوضع النهاري';
            } else {
                icon.textContent = '';
                text.textContent = 'الوضع الليلي';
            }
        }

        function updateDuaCounter() {
            let sections = document.querySelectorAll('.dua-section');
            let counter = document.getElementById('duaCounter');
            let currentDua = 1;

            sections.forEach((section, index) => {
                let rect = section.getBoundingClientRect();
                if (rect.top < window.innerHeight / 2) {
                    currentDua = index + 1;
                }
            });

            counter.textContent = `الدعاء ${toArabic(currentDua)} من ${toArabic(sections.length)}`;
        }

        window.onload = function() {
            updateDuaCounter();
        };
    </script>
</body>
</html>
