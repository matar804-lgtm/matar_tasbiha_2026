workflows:
  tasbiha-ios-adhoc:
    name: Tasbiha iOS - Ad Hoc
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: tasbiha_app_store_connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.matar804.tasbiha

    scripts:
      - name: Configure Xcode signing
        script: xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name=1.5.4 \
            --build-number=7 \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log


  tasbiha-ios-unsigned:
    name: Tasbiha iOS - Unsigned IPA for Free Sideloading
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          set -e
          cd ios
          pod install
          cd ..

      - name: Build unsigned iOS app
        script: |
          set -e
          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1 | cut -d ' ' -f 2)"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          if [ -z "$BUILD_NAME" ] || [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NAME" = "$BUILD_NUMBER" ]; then
            echo "Could not read app version from pubspec.yaml"
            exit 1
          fi
          flutter build ios --release --no-codesign --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package unsigned IPA for AltStore
        script: |
          set -e
          mkdir -p build/ios/ipa/Payload
          test -d build/ios/iphoneos/Runner.app
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          VERSION_LINE="$(grep '^version:' pubspec.yaml | head -n 1 | cut -d ' ' -f 2)"
          BUILD_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE##*+}"
          IPA_NAME="Tasbiha-$BUILD_NAME-build$BUILD_NUMBER-unsigned.ipa"
          cd build/ios/ipa
          /usr/bin/zip -qry "$IPA_NAME" Payload
          /usr/bin/unzip -t "$IPA_NAME"
          echo "Created $IPA_NAME (unsigned; must be signed during installation)."

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log